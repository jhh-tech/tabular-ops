name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: windows-latest

    env:
      Solution_Name: TabularOps.slnx
      Test_Project_Path: tests\TabularOps.Core.Tests\TabularOps.Core.Tests.csproj
      Desktop_Project_Path: src\TabularOps.Desktop\TabularOps.Desktop.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore $env:Solution_Name

    - name: Build
      run: dotnet build $env:Solution_Name --configuration Release --no-restore

    - name: Execute unit tests
      run: dotnet test $env:Test_Project_Path --configuration Release --no-build

    # Self-contained single-file exe: runs on any Windows x64 machine without installing .NET.
    - name: Publish
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        dotnet publish $env:Desktop_Project_Path -p:PublishProfile=win-x64 -p:Version=$version
        Compress-Archive -Path publish\* -DestinationPath "TabularOps-${{ github.ref_name }}-win-x64.zip"

    - name: Attach to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: TabularOps-${{ github.ref_name }}-win-x64.zip
